<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitio web en construcción</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #4A8AFF;
      color: white;
      font-size: 32px;
      box-shadow: 0 10px 25px rgba(74, 138, 255, 0.25);
    }

    h1 {
      font-size: 30px;
      margin-bottom: 18px;
      color: #111827;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
      color: #667085;
    }

    .highlight {
      margin-top: 22px;
      padding: 16px 20px;
      border-radius: 12px;
      background: #eef4ff;
      color: #3978e8;
      font-size: 15px;
      font-weight: 600;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 25px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="icon">
      ⚙
    </div>

    <h1>Sitio web en construcción</h1>

    <p>
      Este es el enlace predeterminado de su proyecto,
      donde podrá visualizar los cambios y actualizaciones
      de su sitio web en tiempo real durante el proceso de desarrollo.
    </p>

    <div class="highlight">
      El sitio se actualizará automáticamente a medida que avance el proyecto.
    </div>

  </main>

</body>
</html>
